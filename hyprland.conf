# Hyprland configuration — hyprlang (.conf) format
# Converted 1:1 from hyprland.lua
# Target: Hyprland ≤0.54 (hyprlang / legacy format)
#
# Install path: ~/.config/hypr/hyprland.conf
#
# Required apps:
#   hyprland hyprpaper waybar wofi dunst kitty nautilus
#   grim slurp wl-clipboard cliphist hyprpicker brightnessctl
#   pamixer playerctl swaylock
#
# Optional:
#   blueman nm-applet nwg-look polkit-gnome

################################################################################
# ENVIRONMENT
################################################################################

env = CLUTTER_BACKEND,wayland
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = _JAVA_AWT_WM_NONREPARENTING,1
env = JAVA_TOOL_OPTIONS,-Dawt.useSystemAAFontSettings=on
env = MOZ_ENABLE_WAYLAND,1
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

################################################################################
# MONITORS
################################################################################

monitor = ,preferred,auto,1

################################################################################
# GENERAL
################################################################################

general {
    gaps_in             = 5
    gaps_out            = 10
    border_size         = 2
    col.active_border   = rgba(cba6f7ff) rgba(89b4faff) 45deg
    col.inactive_border = rgba(313244aa)
    layout              = dwindle
    resize_on_border    = true
    allow_tearing       = false
    no_focus_fallback   = false
    hover_icon_on_border = true
}

################################################################################
# INPUT
################################################################################

input {
    kb_layout           = us
    kb_variant          =
    kb_model            =
    kb_options          = caps:escape
    kb_rules            =
    follow_mouse        = 1
    mouse_refocus       = false
    sensitivity         = 0
    accel_profile       = flat
    force_no_accel      = false
    numlock_by_default  = true
    repeat_rate         = 50
    repeat_delay        = 240

    touchpad {
        natural_scroll       = true
        disable_while_typing = true
        tap_to_click         = true
        drag_lock            = false
        scroll_factor        = 1.0
    }
}

################################################################################
# DECORATION
################################################################################

decoration {
    rounding          = 12
    active_opacity    = 1.0
    inactive_opacity  = 0.92
    fullscreen_opacity = 1.0
    dim_inactive      = true
    dim_strength      = 0.08
    dim_special       = 0.30

    shadow {
        enabled        = true
        range          = 20
        render_power   = 3
        offset         = 0 5
        color          = rgba(1a1a2eee)
        color_inactive = rgba(1a1a2e88)
        scale          = 1.0
    }

    blur {
        enabled           = true
        size              = 8
        passes            = 3
        noise             = 0.02
        contrast          = 1.10
        brightness        = 0.90
        xray              = false
        vibrancy          = 0.20
        vibrancy_darkness = 0.0
        new_optimizations = true
        popups            = true
    }
}

################################################################################
# ANIMATIONS
################################################################################

animations {
    enabled = true

    # Bezier curves
    bezier = smooth_out, 0.36, 0.0,  0.66, 1.0
    bezier = smooth_in,  0.25, 1.0,  0.50, 1.0
    bezier = overshoot,  0.05, 0.90, 0.10, 1.05
    bezier = ease_out,   0.16, 1.0,  0.30, 1.0

    # Windows
    animation = windowsIn,   1, 5, overshoot,  slide
    animation = windowsOut,  1, 4, smooth_out, slide
    animation = windowsMove, 1, 4, ease_out

    # Fades
    animation = fadeIn,     1, 4, smooth_in
    animation = fadeOut,    1, 4, smooth_out
    animation = fadeDim,    1, 4, smooth_in
    animation = fadeSwitch, 1, 5, smooth_in

    # Workspaces
    animation = workspaces,       1, 5, overshoot, slidevert
    animation = specialWorkspace, 1, 5, overshoot, slidefadevert 15%
}

################################################################################
# LAYOUTS
################################################################################

dwindle {
    force_split                  = 0
    preserve_split               = true
    smart_split                  = false
    smart_resizing               = true
    permanent_direction_override = false
    special_scale_factor         = 0.80
    split_width_multiplier       = 1.0
    use_active_for_splits        = true
    default_split_ratio          = 1.0
    split_bias                   = 0
}

################################################################################
# MISC
################################################################################

misc {
    disable_hyprland_logo        = true
    disable_splash_rendering     = true
    force_default_wallpaper      = 0
    mouse_move_enables_dpms      = true
    key_press_enables_dpms       = true
    always_follow_on_dnd         = true
    layers_hog_keyboard_focus    = true
    animate_manual_resizes       = true
    animate_mouse_windowdragging = true
    enable_swallow               = true
    swallow_regex                = ^(kitty|alacritty|foot)$
    focus_on_activate            = false
    close_special_on_empty       = true
    vrr                          = 0
}

################################################################################
# RENDER
################################################################################

render {
    direct_scanout = 0
    cm_auto_hdr    = 1
}

################################################################################
# OPENGL
################################################################################

opengl {
    nvidia_anti_flicker = true
}

################################################################################
# CURSOR
################################################################################

cursor {
    sync_gsettings_theme      = true
    no_hardware_cursors       = 2
    enable_hyprcursor         = true
    inactive_timeout          = 3
    warp_on_change_workspace  = 0
}

################################################################################
# BINDS
################################################################################

binds {
    workspace_back_and_forth          = false
    window_direction_monitor_fallback = true
    workspace_center_on               = 1
}

################################################################################
# GESTURES
################################################################################

gestures {
    workspace_swipe         = true
    workspace_swipe_fingers = 3
}

################################################################################
# LAYER RULES
################################################################################

layerrule = blur, waybar
layerrule = blur, wofi
layerrule = blur, rofi

################################################################################
# WINDOW RULES
################################################################################

# Floating utility windows
windowrulev2 = float,           class:^(pavucontrol)$
windowrulev2 = size 800 600,    class:^(pavucontrol)$
windowrulev2 = center,          class:^(pavucontrol)$
windowrulev2 = float,           class:^(blueman-manager)$
windowrulev2 = size 900 700,    class:^(blueman-manager)$
windowrulev2 = center,          class:^(blueman-manager)$
windowrulev2 = float,           class:^(nm-connection-editor)$
windowrulev2 = float,           class:^(xdg-desktop-portal)$
windowrulev2 = float,           class:^(imv)$
windowrulev2 = float,           class:^(mpv)$
windowrulev2 = float,           class:^(nwg-look)$
windowrulev2 = float,           class:^(polkit-gnome-authentication-agent-1)$

# Common dialogs
windowrulev2 = float,  title:^(Open File)$
windowrulev2 = center, title:^(Open File)$
windowrulev2 = float,  title:^(Save As)$
windowrulev2 = float,  title:^(Confirm)$
windowrulev2 = float,  title:^(Question)$

# Picture-in-Picture
windowrulev2 = float,           title:^(.*Picture.in.Picture.*)$
windowrulev2 = pin,             title:^(.*Picture.in.Picture.*)$
windowrulev2 = keepaspectratio, title:^(.*Picture.in.Picture.*)$
windowrulev2 = noborder,        title:^(.*Picture.in.Picture.*)$
windowrulev2 = size 480 270,    title:^(.*Picture.in.Picture.*)$
windowrulev2 = move 100%-490 100%-290, title:^(.*Picture.in.Picture.*)$

# Opacity — active / inactive
windowrulev2 = opacity 0.95 override 0.85 override, class:^(kitty)$
windowrulev2 = opacity 0.95 override 0.85 override, class:^(Alacritty)$
windowrulev2 = opacity 0.98 override 0.90 override, class:^(Code)$
windowrulev2 = opacity 0.98 override 0.90 override, class:^(codium)$

# Gaming
windowrulev2 = immediate,  class:^(steam_app_.*)$
windowrulev2 = fullscreen, class:^(steam_app_.*)$
windowrulev2 = tag +game,  class:^(steam_app_.*)$
windowrulev2 = immediate,  class:^(gamescope)$
windowrulev2 = tag +game,  class:^(gamescope)$

# Workspace assignments
windowrulev2 = workspace 1 silent, class:^(kitty)$
windowrulev2 = workspace 2 silent, class:^(firefox)$
windowrulev2 = workspace 2 silent, class:^(chromium)$
windowrulev2 = workspace 3 silent, class:^(Code)$
windowrulev2 = workspace 4 silent, class:^(discord)$
windowrulev2 = workspace 4 silent, class:^(WebCord)$
windowrulev2 = workspace 5 silent, class:^(Spotify)$
windowrulev2 = workspace 9 silent, class:^(steam)$

################################################################################
# AUTO-START
################################################################################

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hyprpaper
exec-once = waybar
exec-once = dunst
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

################################################################################
# KEYBINDINGS
################################################################################

$mod        = SUPER
$terminal   = kitty
$filemanager= nautilus
$browser    = firefox
$launcher   = wofi --show drun

# --- Core ---
bind = $mod, RETURN,        exec, $terminal
bind = $mod, Q,             killactive
bind = $mod, M,             exit
bind = $mod, E,             exec, $filemanager
bind = $mod, B,             exec, $browser
bind = $mod, SPACE,         exec, $launcher
bind = $mod SHIFT, SPACE,   togglefloating
bind = $mod, F,             fullscreen, 0
bind = $mod SHIFT, F,       fullscreen, 1
bind = $mod, P,             pseudo
bind = $mod, J,             togglesplit
bind = $mod, C,             centerwindow

# --- Screenshots ---
bind  = , Print,       exec, mkdir -p $HOME/Pictures/Screenshots && grim $HOME/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png
bind  = SHIFT, Print,  exec, mkdir -p $HOME/Pictures/Screenshots && grim -g "$(slurp)" $HOME/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png
bind  = CTRL,  Print,  exec, grim -g "$(slurp)" - | wl-copy

# --- Color picker / clipboard / lock ---
bind = $mod SHIFT, C,  exec, hyprpicker -a
bind = $mod, V,        exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mod SHIFT, L,  exec, swaylock

# --- Focus ---
bind = $mod, H,     movefocus, l
bind = $mod, L,     movefocus, r
bind = $mod, K,     movefocus, u
bind = $mod, J,     movefocus, d
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# --- Move windows ---
bind = $mod SHIFT, H,     movewindow, l
bind = $mod SHIFT, L,     movewindow, r
bind = $mod SHIFT, K,     movewindow, u
bind = $mod SHIFT, J,     movewindow, d
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# --- Resize submap ---
bind = $mod, R, submap, resize

submap = resize
binde = , H,     resizeactive, -30 0
binde = , L,     resizeactive,  30 0
binde = , K,     resizeactive,  0 -30
binde = , J,     resizeactive,  0  30
binde = , left,  resizeactive, -30 0
binde = , right, resizeactive,  30 0
binde = , up,    resizeactive,  0 -30
binde = , down,  resizeactive,  0  30
bind  = , RETURN, submap, reset
bind  = , ESCAPE, submap, reset
bind  = $mod, R,  submap, reset
submap = reset

# --- Workspaces ---
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod CTRL, 1, movetoworkspacesilent, 1
bind = $mod CTRL, 2, movetoworkspacesilent, 2
bind = $mod CTRL, 3, movetoworkspacesilent, 3
bind = $mod CTRL, 4, movetoworkspacesilent, 4
bind = $mod CTRL, 5, movetoworkspacesilent, 5
bind = $mod CTRL, 6, movetoworkspacesilent, 6
bind = $mod CTRL, 7, movetoworkspacesilent, 7
bind = $mod CTRL, 8, movetoworkspacesilent, 8
bind = $mod CTRL, 9, movetoworkspacesilent, 9
bind = $mod CTRL, 0, movetoworkspacesilent, 10

bind = $mod, mouse_down,  workspace, e+1
bind = $mod, mouse_up,    workspace, e-1
bind = $mod, TAB,         workspace, e+1
bind = $mod SHIFT, TAB,   workspace, e-1
bind = $mod, GRAVE,       workspace, previous

# --- Special workspace (scratchpad) ---
bind = $mod,       S, togglespecialworkspace, scratch
bind = $mod SHIFT, S, movetoworkspacesilent,  special:scratch

# --- Mouse drag ---
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# --- Media keys ---
bindel = , XF86AudioRaiseVolume,   exec, pamixer -i 5
bindel = , XF86AudioLowerVolume,   exec, pamixer -d 5
bindl  = , XF86AudioMute,          exec, pamixer -t
bindl  = , XF86AudioMicMute,       exec, pamixer --default-source -t
bindel = , XF86MonBrightnessUp,    exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown,  exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay,          exec, playerctl play-pause
bindl  = , XF86AudioNext,          exec, playerctl next
bindl  = , XF86AudioPrev,          exec, playerctl previous
bindl  = , XF86AudioStop,          exec, playerctl stop

# --- Reload ---
bind = $mod SHIFT, R, exec, hyprctl reload